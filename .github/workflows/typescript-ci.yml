name: TypeScript CI

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "typescript/**"
      - ".github/workflows/**"

jobs:
  typescript-ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: "typescript/.nvmrc"

      - name: Install Dependencies
        run: npm ci
        working-directory: typescript

      - name: Lint
        run: npm run lint
        working-directory: typescript

      - name: Check Format
        run: npm run check-format
        working-directory: typescript

      - name: Type Check
        run: npm run type-check
        working-directory: typescript

      - name: Test
        run: npm test
        working-directory: typescript

      - name: Build
        run: npm run build
        working-directory: typescript

      - name: Publish (dry-run)
        run: npm publish --dry-run
        working-directory: typescript

      # Loads .releaserc.json and every plugin, then exits on the pull request
      # check before any authentication, so no token is needed. On main the
      # trusted publisher is bound to publish-typescript.yml, and that
      # workflow runs the real release.
      - name: Verify Semantic Release Config
        if: github.event_name == 'pull_request'
        run: npx semantic-release --dry-run
        working-directory: typescript
